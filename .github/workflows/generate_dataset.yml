name: Resume Dataset Generator — Scheduled Run

# ============================================================
# This workflow triggers n8n on a schedule (or manually)
# to generate a new batch of synthetic resume data.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   N8N_BASE_URL          e.g. https://your-n8n-instance.com
#   N8N_API_KEY           n8n Settings → API → Create API Key
#   N8N_WORKFLOW_ID       ID of the imported workflow
#
# Optional — only needed if n8n is behind basic auth:
#   N8N_BASIC_AUTH_USER
#   N8N_BASIC_AUTH_PASSWORD
# ============================================================

on:
  # Run every weekday at 2 AM UTC
  schedule:
    - cron: "0 2 * * 1-5"

  # Also allow a manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      batch_note:
        description: "Short note about this batch (logged in run summary)"
        required: false
        default: "manual trigger"

jobs:
  trigger-n8n:
    name: Trigger n8n Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Validate secrets are present ──────────────────────
      - name: Validate secrets
        run: |
          [ -z "${{ secrets.N8N_BASE_URL }}"     ] && echo "::error::N8N_BASE_URL secret is missing"     && exit 1 || true
          [ -z "${{ secrets.N8N_API_KEY }}"      ] && echo "::error::N8N_API_KEY secret is missing"      && exit 1 || true
          [ -z "${{ secrets.N8N_WORKFLOW_ID }}"  ] && echo "::error::N8N_WORKFLOW_ID secret is missing"  && exit 1 || true
          echo "All required secrets are present."

      # ── Trigger the workflow execution via n8n REST API ───
      - name: Trigger n8n workflow
        id: trigger
        run: |
          BASE_URL="${{ secrets.N8N_BASE_URL }}"
          WORKFLOW_ID="${{ secrets.N8N_WORKFLOW_ID }}"

          echo "Triggering workflow $WORKFLOW_ID on $BASE_URL ..."

          RESPONSE=$(curl -sf -X POST \
            "${BASE_URL}/api/v1/workflows/${WORKFLOW_ID}/execute" \
            -H "X-N8N-API-KEY: ${{ secrets.N8N_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"runData": {}}')

          EXECUTION_ID=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(d.get('data', {}).get('executionId', d.get('executionId', 'unknown')))
          ")

          echo "execution_id=$EXECUTION_ID" >> "$GITHUB_OUTPUT"
          echo "Execution started: ID=$EXECUTION_ID"

      # ── Poll for completion (up to 8 minutes) ─────────────
      - name: Wait for execution to complete
        run: |
          BASE_URL="${{ secrets.N8N_BASE_URL }}"
          EXEC_ID="${{ steps.trigger.outputs.execution_id }}"
          MAX_ATTEMPTS=48   # 48 × 10s = 8 minutes
          ATTEMPT=0

          echo "Polling execution $EXEC_ID ..."

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            sleep 10

            STATUS=$(curl -sf \
              "${BASE_URL}/api/v1/executions/${EXEC_ID}" \
              -H "X-N8N-API-KEY: ${{ secrets.N8N_API_KEY }}" \
              | python3 -c "
            import sys, json
            d = json.load(sys.stdin)
            print(d.get('status', 'unknown'))
            ")

            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — status: $STATUS"

            case "$STATUS" in
              success)
                echo "✓ Workflow completed successfully."
                exit 0
                ;;
              error|crashed|failed)
                echo "::error::Workflow execution failed with status: $STATUS"
                echo "Check n8n UI: ${BASE_URL}/executions/${EXEC_ID}"
                exit 1
                ;;
            esac
          done

          echo "::error::Timed out waiting for workflow to complete."
          exit 1

      # ── Summary ───────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Resume Dataset Generator Run

          | Field | Value |
          |-------|-------|
          | Execution ID | ${{ steps.trigger.outputs.execution_id }} |
          | Trigger | ${{ github.event_name }} |
          | Note | ${{ github.event.inputs.batch_note || 'scheduled' }} |
          | n8n URL | ${{ secrets.N8N_BASE_URL }} |
          | Workflow ID | ${{ secrets.N8N_WORKFLOW_ID }} |
          EOF
